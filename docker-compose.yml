version: '3.8'

services:
  # Servicio 1: Nuestra aplicación PHP MVC
  web-app:
    build: .
    container_name: mvc_app_container
    ports:
      - "8080:80" # Acceso desde la laptop en el puerto 8080
    depends_on:
      - db-mysql

  # Servicio 2: El motor de Base de Datos MySQL
  db-mysql:
    image: mysql:8.0
    container_name: mvc_mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: clave_secreta_nube
      MYSQL_DATABASE: db_proyecto_mvc
    ports:
      - "3306:3306"
    volumes:
      - datos-persistentes:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Servicio 3: Administrador gráfico para crear las tablas fácilmente
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mvc_phpmyadmin_container
    ports:
      - "8085:80" # Acceso a phpMyAdmin en el puerto 8085
    environment:
      PMA_HOST: db-mysql
      MYSQL_ROOT_PASSWORD: clave_secreta_nube
    depends_on:
      - db-mysql

volumes:
  datos-persistentes:
